components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageQuery:
      name: page
      in: query
      description: 1-indexed pagination page
      schema:
        type: number
        default: 1
        minimum: 1
    LimitQuery:
      name: limit
      in: query
      description: Number of items per page (capped at 100)
      schema:
        type: number
        default: 20
        minimum: 1
        maximum: 100

  responses:
    ValidationError:
      description: Request body or query parameters validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    UnauthorizedError:
      description: Invalid or expired authentication token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    ForbiddenError:
      description: Insufficient role permissions or scope authorization
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    NotFoundError:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    ConflictError:
      description: Conflict with existing unique constraint or resource state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"

  schemas:
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    DetailedReadiness:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum: [ready, not_ready, shutting_down]
        shuttingDown:
          type: boolean
        checks:
          type: object
          required:
            - database
          properties:
            database:
              type: boolean
            redis:
              type: boolean
            dashboardCache:
              type: object
              properties:
                configured:
                  type: boolean
                operational:
                  type: boolean
                state:
                  type: string

    ApiErrorResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
        status:
          type: string
          example: fail
        message:
          type: string
          example: Invalid input parameters
        errorId:
          type: string
          example: err_1728591234_a1b2c3d4
        errors:
          type: array
          items:
            type: string

    StudentGroupItem:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: number
        name:
          type: string
        departmentId:
          type: number
          nullable: true
        year:
          type: number
          nullable: true
        parentGroupId:
          type: number
          nullable: true

    StudentGroupListResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/StudentGroupItem"

    StudentGroupAutoDivideRequest:
      type: object
      properties:
        numberOfGroups:
          type: number
        maxGroupSize:
          type: number
        confirmed:
          type: boolean
        year:
          type: number

    StudentGroupSplitRequest:
      type: object
      properties:
        numberOfSubgroups:
          type: number
        maxSubgroupSize:
          type: number
        confirmed:
          type: boolean

    StudentGroupDeleteRequest:
      type: object
      properties:
        confirmed:
          type: boolean

    StudentGroupOverrideRequest:
      type: object
      properties:
        groupId:
          type: number
          nullable: true

    SuccessMessageResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully

    AiChatRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000

    AiChatResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          additionalProperties: false
          required: [reply]
          properties:
            reply:
              type: string

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - name
        - role
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
        name:
          type: string
        role:
          type: string
          enum: [STUDENT, DOCTOR, TEACHING_ASSISTANT]
        departmentId:
          type: number
        nationalId:
          type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string
        totpCode:
          type: string
          description: 6-digit TOTP token if 2FA is active

    AuthSuccessResponse:
      type: object
      required:
        - success
        - token
        - user
      properties:
        success:
          type: boolean
          example: true
        token:
          type: string
          description: Ephemeral in-memory JWT access token
        requires2FA:
          type: boolean
        user:
          $ref: "#/components/schemas/UserProfile"

    UserProfile:
      type: object
      required:
        - id
        - email
        - name
        - role
      properties:
        id:
          type: number
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [SUPER_ADMIN, ADMIN, COLLEGE_ADMIN, DEPARTMENT_ADMIN, DOCTOR, TEACHING_ASSISTANT, STUDENT]
        departmentId:
          type: number
          nullable: true
        collegeId:
          type: number
          nullable: true
        twoFactorEnabled:
          type: boolean
        avatarUrl:
          type: string
          nullable: true

    UserProfileResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/UserProfile"

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        bio:
          type: string

    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    PasswordConfirmationRequest:
      type: object
      required:
        - currentPassword
      properties:
        currentPassword:
          type: string

    TwoFactorSetupResponse:
      type: object
      required:
        - secret
        - qrCodeUrl
      properties:
        secret:
          type: string
        qrCodeUrl:
          type: string

    TwoFactorEnableRequest:
      type: object
      required:
        - code
        - currentPassword
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
        currentPassword:
          type: string

    PaginationMeta:
      type: object
      required:
        - total
        - page
        - limit
        - totalPages
      properties:
        total:
          type: number
        page:
          type: number
        limit:
          type: number
        totalPages:
          type: number

    StudentDetail:
      type: object
      required:
        - id
        - name
        - email
        - academicCode
      properties:
        id:
          type: number
        name:
          type: string
        email:
          type: string
        academicCode:
          type: string
        departmentName:
          type: string
          nullable: true
        gpa:
          type: number
          nullable: true
        academicYear:
          type: number
          nullable: true

    StudentListResponse:
      type: object
      required:
        - success
        - data
        - pagination
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/StudentDetail"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"

    CollegeItem:
      type: object
      required:
        - id
        - name
        - code
      properties:
        id:
          type: number
        name:
          type: string
        code:
          type: string
