openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: Authoritative OpenAPI specification for Smart University Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health and readiness monitoring
  - name: auth
    description: Authentication and identity lifecycle
  - name: users
    description: User account, credential, and 2FA management
  - name: students
    description: Student records and academic status
  - name: colleges
    description: Colleges institutional management
  - name: departments
    description: Academic department management
  - name: courses
    description: Course catalog, syllabus, and roster
  - name: enrollment
    description: Course registration and approval workflows
  - name: attendance
    description: Multi-mode attendance tracking and sessions
  - name: tasks
    description: Academic tasks, assignments, and submissions
  - name: quizzes
    description: Digital quizzes, attempts, and questions
  - name: exams
    description: Examination scheduling, seating, and evaluation
  - name: schedules
    description: Lecture slots, conflict resolution, and timetable
  - name: payments
    description: Lossless decimal tuition fees and transaction history
  - name: analytics
    description: Institutional metrics and performance indicators
  - name: notifications
    description: User alert broadcasts and read receipts
  - name: ai
    description: University AI assistant foundation
  - name: academic-terms
    description: Institutional academic calendar and semester terms
  - name: academic-years
    description: Institutional academic years and calendar cycles

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health liveness probe
      description: Returns server liveness status
      responses:
        "200":
          description: Server process is live
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Standard liveness endpoint
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /ready:
    get:
      operationId: getPublicReadiness
      tags: [health]
      summary: Public readiness probe
      responses:
        "200":
          description: Process ready to accept traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Shutting down or unready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /health/readiness:
    get:
      operationId: getDetailedReadiness
      tags: [health]
      summary: Comprehensive infrastructure readiness probe (Admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Infrastructure components healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailedReadiness"
        "503":
          description: Infrastructure degraded or offline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailedReadiness"

  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register a new student or faculty member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: Registration request submitted for administrative review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Authenticate user credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /auth/refresh:
    post:
      operationId: refreshTokens
      tags: [auth]
      summary: Refresh access token using secure HttpOnly refresh cookie
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      summary: Terminate session and invalidate refresh token
      responses:
        "200":
          description: Successfully logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageResponse"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Retrieve authenticated user profile and scopes
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /users/profile:
    put:
      operationId: updateProfile
      tags: [users]
      summary: Update personal profile details
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /users/profile/password:
    put:
      operationId: changePassword
      tags: [users]
      summary: Change account password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /users/2fa/setup:
    post:
      operationId: setupTwoFactor
      tags: [users]
      summary: Generate 2FA TOTP secret and QR code URI
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmationRequest"
      responses:
        "200":
          description: TOTP setup parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorSetupResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /users/2fa/enable:
    post:
      operationId: enableTwoFactor
      tags: [users]
      summary: Confirm TOTP code and activate 2FA
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorEnableRequest"
      responses:
        "200":
          description: 2FA activated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /users/2fa/disable:
    post:
      operationId: disableTwoFactor
      tags: [users]
      summary: Deactivate 2FA for account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmationRequest"
      responses:
        "200":
          description: 2FA deactivated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageResponse"

  /students:
    get:
      operationId: listStudents
      tags: [students]
      summary: Query paginated student directory
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - name: departmentId
          in: query
          schema:
            type: number
        - name: academicYear
          in: query
          schema:
            type: number
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated student listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentListResponse"

  /students/{id}:
    get:
      operationId: getStudentById
      tags: [students]
      summary: Retrieve student record by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDetail"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /student-groups:
    get:
      operationId: getAllStudentGroups
      tags: [students]
      summary: Retrieve all student groups
      security:
        - bearerAuth: []
      parameters:
        - name: departmentId
          in: query
          required: false
          schema:
            type: number
        - name: year
          in: query
          required: false
          schema:
            type: number
      responses:
        "200":
          description: List of student groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentGroupListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /student-groups/departments/{departmentId}/groups:
    get:
      operationId: getStudentGroupsByDepartment
      tags: [students]
      summary: Get student groups for a specific department
      security:
        - bearerAuth: []
      parameters:
        - name: departmentId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of student groups in department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentGroupListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /student-groups/departments/{departmentId}/groups/auto-divide:
    post:
      operationId: autoDivideStudentGroups
      tags: [students]
      summary: Automatically divide department students into groups
      security:
        - bearerAuth: []
      parameters:
        - name: departmentId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentGroupAutoDivideRequest"
      responses:
        "200":
          description: Students divided successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /student-groups/groups/{groupId}/split:
    post:
      operationId: splitStudentGroup
      tags: [students]
      summary: Split student group into subgroups
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentGroupSplitRequest"
      responses:
        "200":
          description: Group split successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /student-groups/groups/{groupId}:
    delete:
      operationId: deleteStudentGroup
      tags: [students]
      summary: Delete student group
      security:
        - bearerAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentGroupDeleteRequest"
      responses:
        "200":
          description: Group deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /student-groups/students/{studentId}/group:
    put:
      operationId: manualOverrideStudentGroup
      tags: [students]
      summary: Override student group assignment
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentGroupOverrideRequest"
      responses:
        "200":
          description: Student group updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /colleges:
    get:
      operationId: listColleges
      tags: [colleges]
      summary: List all academic colleges
      responses:
        "200":
          description: List of colleges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CollegeItem"

  /departments:
    get:
      operationId: listDepartments
      tags: [departments]
      summary: List all academic departments
      parameters:
        - name: collegeId
          in: query
          schema:
            type: number
      responses:
        "200":
          description: List of departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DepartmentItem"

  /courses:
    get:
      operationId: listCourses
      tags: [courses]
      summary: Browse catalog courses
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - name: departmentId
          in: query
          schema:
            type: number
        - name: semester
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated courses list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseListResponse"

  /courses/{courseId}/grade-structure:
    get:
      operationId: getCourseGradeStructure
      tags: [courses]
      summary: Get course grade structure
      description: Returns configured grade components, total points, pass mark, and lock status for a course in a given term
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
        - name: termId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Course grade structure details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseGradeStructureResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"
    put:
      operationId: updateCourseGradeStructure
      tags: [courses]
      summary: Update course grade structure
      description: Upserts grade components and pass mark for a course in a given term with serializable isolation
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
        - name: termId
          in: query
          required: false
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseGradeStructureInput"
      responses:
        "200":
          description: Updated course grade structure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseGradeStructureResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /courses/{courseId}/gradebook:
    get:
      operationId: getCourseGradebook
      tags: [courses]
      summary: Get course gradebook
      description: Returns course grade structure and enrolled students with grade entries for a given term
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
        - name: termId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Gradebook data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseGradebookResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /courses/{courseId}/gradebook/draft:
    post:
      operationId: saveCourseGradebookDraft
      tags: [courses]
      summary: Save gradebook draft entries
      description: Atomically creates, updates, or clears draft grade entries with serializable transaction isolation
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
        - name: termId
          in: query
          required: false
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseGradebookDraftInput"
      responses:
        "200":
          description: Draft entries saved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseGradebookDraftResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /courses/{courseId}/gradebook/publish:
    post:
      operationId: publishCourseGradebook
      tags: [courses]
      summary: Publish gradebook entries and evaluate enrollment completion
      description: Flips draft entries to published and evaluates completeness and final grades with serializable transaction isolation
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
        - name: termId
          in: query
          required: false
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                enrollmentIds:
                  type: array
                  items:
                    type: integer
      responses:
        "200":
          description: Gradebook published successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /courses/{courseId}/gradebook/correct:
    post:
      operationId: correctCourseGradebook
      tags: [courses]
      summary: Correct published grade entries
      description: Atomically corrects published manual grade entries and recomputes completion with optimistic concurrency locking
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: integer
        - name: termId
          in: query
          required: false
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [corrections]
              properties:
                corrections:
                  type: array
                  items:
                    type: object
                    required: [enrollmentId, componentId, version, reason]
                    properties:
                      enrollmentId:
                        type: integer
                      componentId:
                        type: integer
                      score:
                        type: number
                        nullable: true
                      isAbsent:
                        type: boolean
                      version:
                        type: integer
                      reason:
                        type: string
      responses:
        "200":
          description: Corrections applied successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /courses/{id}:
    get:
      operationId: getCourseById
      tags: [courses]
      summary: Get course specification and syllabus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Course details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /enrollments/my-grades:
    get:
      operationId: getMyGrades
      tags: [enrollment]
      summary: Get student personal grades and component breakdowns
      description: Returns published grade entries, components, pass mark, and completion status for authenticated student
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Student grades report
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /enrollments:
    get:
      operationId: listEnrollments
      tags: [enrollment]
      summary: Get active student enrolled courses
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Enrolled courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnrollmentItem"
    post:
      operationId: enrollStudent
      tags: [enrollment]
      summary: Enroll a student into a course
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentSubmitRequest"
      responses:
        "201":
          description: Request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentItem"
        "400":
          $ref: "#/components/responses/ValidationError"

  /attendance/my-attendance:
    get:
      operationId: getMyAttendance
      tags: [attendance]
      summary: Query attendance summary and presence rate for student
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Student attendance report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceSummaryResponse"

  /attendance/scan-qr:
    post:
      operationId: scanAttendanceQr
      tags: [attendance]
      summary: Verify dynamic rolling QR token for student attendance
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QrAttendanceScanRequest"
      responses:
        "200":
          description: Attendance marked successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceScanResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
